apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: sandbox-platform
  labels:
    app: sandbox-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      serviceAccountName: sandbox-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api
          image: ghcr.io/yourusername/sandbox-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sandbox-config
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: JWT_SECRET_KEY
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: API_KEYS
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-worker
  namespace: sandbox-platform
  labels:
    app: sandbox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-worker
  template:
    metadata:
      labels:
        app: sandbox-worker
    spec:
      serviceAccountName: sandbox-sa
      containers:
        - name: worker
          image: ghcr.io/yourusername/sandbox-api:latest
          command: ["python", "-m", "worker.cleanup"]
          envFrom:
            - configMapRef:
                name: sandbox-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
