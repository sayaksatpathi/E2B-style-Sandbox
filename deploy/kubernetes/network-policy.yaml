apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-api-netpol
  namespace: sandbox-platform
spec:
  podSelector:
    matchLabels:
      app: sandbox-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
    - ports:
        - port: 53
          protocol: UDP
