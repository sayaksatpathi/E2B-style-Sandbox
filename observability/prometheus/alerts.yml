groups:
  - name: sandbox_alerts
    rules:
      - alert: HighExecutionFailureRate
        expr: |
          rate(sandbox_execution_failures_total[5m]) /
          (rate(sandbox_execution_total[5m]) + 0.001) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High sandbox execution failure rate (> 10%)"
          description: "Execution failure rate is {{ $value | humanizePercentage }}"

      - alert: SandboxCreationFailures
        expr: rate(sandbox_creation_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sandbox creation failures detected"
          description: "{{ $value }} failures/sec in the last 5m"

      - alert: TooManyActiveSandboxes
        expr: active_sandboxes > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High active sandbox count"
          description: "{{ $value }} active sandboxes"

      - alert: SlowExecutions
        expr: |
          histogram_quantile(0.95, rate(sandbox_execution_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 execution latency > 10s"
          description: "p95 = {{ $value }}s"

      - alert: APIDown
        expr: up{job="sandbox-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sandbox API is down"
