[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sandbox-platform"
version = "1.0.0"
description = "E2B-style ephemeral code sandbox platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cli = ["typer", "rich", "httpx"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "bandit"]

[project.scripts]
sandbox = "cli.main:app"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
